<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta http-equiv="Content-Type" content="text/html; charset=utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Línea parada EF-07</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Concepto: panel de control de planta. Cabecera fija con cronómetro de paro y puntos; una estación por pantalla. */
:root{
  --bg:#eceff1; --panel:#ffffff; --panel2:#e2e7ea; --fg:#171c20; --muted:#55616a; --line:#c5cdd3;
  --accent:#f2b705; --on-accent:#171c20; --alert:#c93a3a; --ok:#1f8a5b; --info:#2a6f9e;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101417; --panel:#1a2024; --panel2:#242c31; --fg:#e8edf0; --muted:#9aa8b1; --line:#344047;
  --accent:#f2b705; --on-accent:#171c20; --alert:#ef6b6b; --ok:#4cc48e; --info:#6cb4e4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101417; --panel:#1a2024; --panel2:#242c31; --fg:#e8edf0; --muted:#9aa8b1; --line:#344047;
  --accent:#f2b705; --on-accent:#171c20; --alert:#ef6b6b; --ok:#4cc48e; --info:#6cb4e4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:860px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;border-bottom:2px solid var(--accent)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.hrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.brand{font:700 22px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;font:500 11px/1.4 var(--mono);letter-spacing:.08em;color:var(--muted);margin-top:3px}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);padding:4px 10px;font:500 13px var(--mono);font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:baseline}
.chip b{font:700 20px/1 var(--display);letter-spacing:.03em}
.chip.clock b{color:var(--alert)}
.chip.run b{color:var(--ok)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;min-height:26px}
.badge{font:500 12px var(--mono);background:var(--accent);color:var(--on-accent);padding:3px 8px;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.steps{display:flex;gap:4px;margin-top:8px}
.steps i{flex:1;height:5px;background:var(--panel2)}
.steps i.on{background:var(--accent)}.steps i.done{background:var(--ok)}
main{padding-top:20px}
.eyebrow{font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1,h2{font:700 clamp(30px,6vw,44px)/1.02 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:6px 0 12px;text-wrap:balance}
h3{font:700 20px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0 0 6px}
p{margin:0 0 12px;max-width:65ch}
.card{background:var(--panel);border:1px solid var(--line);padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid>*{min-width:0}
button{font:600 15px var(--body);cursor:pointer;border:1px solid var(--fg);background:transparent;color:var(--fg);padding:10px 14px;min-height:44px}
button:hover:not(:disabled){background:var(--panel2)}
button:focus-visible,input:focus-visible{outline:3px solid var(--info);outline-offset:2px}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
button.primary:hover:not(:disabled){filter:brightness(1.06);background:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.link{border:none;padding:6px 0;min-height:0;text-decoration:underline;color:var(--muted);font-weight:500}
.role{text-align:left;padding:16px;display:block;width:100%;background:var(--panel)}
.role h3{margin-bottom:4px}
.role ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.tool{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.tool .read{font:400 14px/1.5 var(--mono);background:var(--panel2);padding:8px 10px;width:100%;border-left:4px solid var(--info)}
.tool .read.bad{border-left-color:var(--alert)}
.tool .read.good{border-left-color:var(--ok)}
.tool.locked{opacity:.9;border-style:dashed}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);background:var(--panel);margin:8px 0;cursor:pointer}
.opt input{margin-top:5px;width:18px;height:18px;flex:none;accent-color:var(--accent)}
.opt.picked{border-color:var(--fg)}
.opt.wrong{border-color:var(--alert)}
.opt.right{border-color:var(--ok)}
.seq{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.seq button{text-align:left;font-weight:500}
.seq button.used{background:var(--ok);border-color:var(--ok);color:#fff;opacity:1}
.order{font:500 13px var(--mono);color:var(--muted);margin:6px 0}
.fb{padding:10px 12px;border-left:4px solid var(--info);background:var(--panel2);margin:10px 0;font-size:15px}
.fb.bad{border-color:var(--alert)}.fb.good{border-color:var(--ok)}.fb.warn{border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{font:700 clamp(56px,14vw,96px)/1 var(--display);color:var(--accent)}
.sheet{width:100%;min-height:120px;font:13px/1.5 var(--mono);background:var(--panel2);color:var(--fg);border:1px solid var(--line);padding:10px}
.tbl{overflow-x:auto}
.fig{margin:0 0 16px;background:var(--panel);border:1px solid var(--line);padding:12px}
.fig{overflow-x:auto}
.fig svg{display:block;width:100%;min-width:600px;height:auto}
.fig svg[width]{min-width:0}
.fig figcaption{font-size:13px;color:var(--muted);margin:6px 0 8px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:4px 16px;margin:0;padding:0;list-style:none;font-size:14px}
.legend li{display:flex;gap:8px;align-items:baseline}
.legend b{flex:none;width:20px;height:20px;background:var(--accent);color:var(--on-accent);font:700 12px/20px var(--mono);text-align:center;border-radius:50%}
svg .part{fill:var(--panel2);stroke:var(--muted);stroke-width:1.5}
svg .part.hl{stroke:var(--accent);stroke-width:4}
svg .lbl{fill:var(--fg);font:600 12px var(--body)}
svg .lbl.s{font-size:10px;fill:var(--muted);font-weight:400}
svg .link{stroke:var(--muted);stroke-width:12;stroke-linecap:round;fill:none}
svg .shaft{stroke:var(--muted);stroke-width:5}
svg .rail{fill:var(--muted)}
svg .floor{stroke:var(--line);stroke-width:2;stroke-dasharray:6 4}
svg .mark{fill:var(--accent)}
svg .mt{fill:var(--on-accent);font:700 12px var(--mono);text-anchor:middle}
svg .wire{stroke:var(--info);stroke-width:2;fill:none}
svg .oil{fill:var(--alert)}
svg .ax{stroke:var(--line);stroke-width:1}
svg .tick{fill:var(--muted);font:11px var(--mono)}
svg .sig{fill:none;stroke:var(--fg);stroke-width:1.4}
svg .cB{stroke:var(--info)}svg .cI{stroke:var(--alert)}svg .cS{stroke:var(--ok)}svg .cF{stroke:var(--muted)}svg .cR{stroke:var(--accent)}
svg .cur{stroke:var(--fg);stroke-width:1;stroke-dasharray:2 3}
.ds{font:13px/1.6 var(--mono)}
.ds dt{color:var(--muted);float:left;clear:left;width:15em}.ds dd{margin:0 0 0 15em}
.tgl{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.tgl button{min-height:38px;font-size:14px}
.tgl button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.rd{font:500 14px var(--mono);margin:6px 0}
input[type=range]{width:100%;accent-color:var(--accent)}
.sim{font:12px var(--mono);color:var(--muted)}
.nb{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:700 12px/22px var(--mono);text-align:center;margin-right:8px;vertical-align:2px;letter-spacing:0}
.pc{font-size:14px;margin:8px 0 0;padding-left:18px}.pc li{margin:2px 0}.pro{color:var(--ok)}.con{color:var(--alert)}
header.top .badges{align-items:center}.me{display:flex;align-items:center;gap:8px;font:600 13px var(--mono)}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:10px 0}
.avp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;background:var(--panel);border:2px solid var(--line);color:var(--fg);font:500 12px var(--mono);cursor:pointer}
.avp[aria-pressed=true]{border-color:var(--accent);background:var(--panel2)}
input.nick{width:100%;box-sizing:border-box;padding:12px;font:600 18px var(--mono);background:var(--panel);color:var(--fg);border:2px solid var(--line)}
input.nick:focus{outline:3px solid var(--accent);outline-offset:1px}
.vit{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0 16px}
.md{display:flex;gap:8px;align-items:center;padding:8px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.md.off{opacity:.45}.md svg{flex:none}.md b{display:block;font-size:13px}
.rk td:first-child,.rk th:first-child{width:34px}.rk tr.you td{background:var(--panel2);font-weight:700}
.hero{display:flex;gap:14px;align-items:center;margin:8px 0 12px}
@media (prefers-reduced-motion:reduce){.badge{animation:none}}
@media (max-width:640px){
 header.top .badges{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
 header.top .badges .badge,header.top .badges .me{flex:none;white-space:nowrap}
 #svb{padding:4px 8px;font-size:12px}
 .brand{font-size:18px}.brand small{display:none}
 .hrow{gap:8px}
 .fig svg{min-width:560px}
 .card,.fb{padding-left:12px;padding-right:12px}
 button{min-height:40px}
 .opt{padding:12px}
}
</style>

<div class="wrap">
<header class="top">
  <div class="hrow">
    <div class="brand">Línea parada<small>ESTACIÓN EF-07 · SISTEMAS MECÁNICOS</small></div>
    <div class="hud">
      <div class="chip clock" id="clockChip">Paro <b id="clock">00:00</b></div>
      <div class="chip">Puntos <b id="pts">0</b></div>
      <button id="svb" style="display:none">Guardar partida</button>

  <div class="steps" id="steps"></div>
  <div class="badges" id="badges" aria-label="Recompensas obtenidas"></div>
</header>
<main id="app"></main>
</div>

QRRSBlock.getRSBlocks = function(typeNumber, errorCorrectLevel) {
	
	var rsBlock = QRRSBlock.getRsBlockTable(typeNumber, errorCorrectLevel);
	
	if (rsBlock === undefined) {
		throw new Error("bad rs block @ typeNumber:" + typeNumber + "/errorCorrectLevel:" + errorCorrectLevel);
	}

	var length = rsBlock.length / 3;
	
	var list = [];
	
	for (var i = 0; i < length; i++) {

		var count = rsBlock[i * 3 + 0];
		var totalCount = rsBlock[i * 3 + 1];
		var dataCount  = rsBlock[i * 3 + 2];

		for (var j = 0; j < count; j++) {
			list.push(new QRRSBlock(totalCount, dataCount) );	
		}
	}
	
	return list;
};

QRRSBlock.getRsBlockTable = function(typeNumber, errorCorrectLevel) {

	switch(errorCorrectLevel) {
	case QRErrorCorrectLevel.L :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 0];
	case QRErrorCorrectLevel.M :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 1];
	case QRErrorCorrectLevel.Q :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 2];
	case QRErrorCorrectLevel.H :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 3];
	default :
		return undefined;
